name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        id: eas-build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          eas build --platform android --profile preview --non-interactive 2>&1 | tee eas-build-output.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Retrieve detailed EAS log on failure
        if: steps.eas-build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          build_url=$(grep -oE 'https://expo.dev/accounts/[^ ]+/projects/[^ ]+/builds/[a-f0-9-]+' eas-build-output.log | tail -1)
          build_id="${build_url##*/}"
          eas build:view "$build_id" --json > eas-build-metadata.json
          log_url=$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("eas-build-metadata.json","utf8")); process.stdout.write(d.logFiles?.[0] ?? "")')
          test -n "$log_url"
          curl --fail --compressed -sSL "$log_url" -o eas-build-log.jsonl
          echo "===== Native build errors ====="
          grep -Ein 'error:|fatal error|FAILURE:|failed|undefined reference|pointer-sign|macro redefined|BUILD FAILED' eas-build-log.jsonl | tail -120 || true

      - name: Upload EAS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-diagnostics
          path: |
            eas-build-output.log
            eas-build-metadata.json
            eas-build-log.jsonl
          if-no-files-found: ignore

      - name: Fail workflow when EAS build failed
        if: steps.eas-build.outcome == 'failure'
        run: exit 1
